<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>

    <link rel="stylesheet" href="styles.css">


    <style>
        main {

            height: 80vh;
        }

        .contact-form {
            background-color: bisque;
        }
    </style>
</head>

<body>

    <header>
        <!-- LOGO -->
        <div>
            <span id="logo">Ahmad </span> <span class="logo-blue">Raza</span>
        </div>

        <!-- Navigation Links -->
        <nav class="links" id="navbar">
            <a class="firstlink" href="#home">Home</a>
            <a href="#section-one">About</a>
            <a href="#section-two">Skills</a>
            <a href="#section-four">Goals</a>
            <a href="#section-five">Contact</a>
        </nav>
    </header>
    <main>

        <div>
            <h1>Contact Page</h1>
        </div>
        <div class="contact-form">
            <h2>Contact Form</h2>
            <form>
                <label for="username">Username</label>
                <input type="text" name="username">
                <br>
                <label for="email">Email</label>
                <input type="email" name="email">
                <br>

                <label for="">Password</label>
                <input type="password" name="password">
                <br>

                <label for="">Number</label>
                <input type="number" name="number">
                <br>

                <label for="">Button</label>
                <input type="button" value='Button' name="number">
                <br>

                <input type="checkbox" name="agrement">
                <label for="">Check to Save Password</label>
                <br>

                <label for="">Gender</label><br>
                <input type="radio" value="male" name="gender">
                <label for="">Male</label>
                <br>
                <input type="radio" value="female" name="gender">
                <label for="">Female</label>

                <br>
                <label for="">Marital Status</label><br>
                <input type="radio" value="single" name="maritalstatus">
                <label for="">Single</label>
                <br>
                <input type="radio" value="married" name="maritalstatus">
                <label for="">Maried</label>
                <br>
                <input type="radio" value="divorced" name="maritalstatus">
                <label for="">Divorced</label>

                <br>

                <input type="submit">


            </form>
        </div>

    </main>
    <footer class="home-footer">
        <p class="footer-content">2026 Ahmed Raza . All rights reserved</p>
    </footer>
</body>

</html>
